# =============================================================================
# Idea-Party Docker Compose (Tencent Cloud production)
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. Edit .env.production with real values (DB password, JWT secret, API keys)
#   3. docker compose build        # build images
#   4. docker compose up -d        # start stack
#   5. docker compose logs -f      # follow logs
#   6. docker compose down         # stop (keeps volumes)
#   7. docker compose down -v      # stop + WIPE volumes (DESTRUCTIVE)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 8 — primary database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: idea-mysql
    restart: unless-stopped
    networks:
      - idea-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ideaparty}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      # First-run init scripts (only executed on empty data dir)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Don't expose MySQL to host in production; only the server connects.
    # Uncomment the next line if you need to inspect the DB from outside.
    # ports:
    #   - "127.0.0.1:3306:3306"
    # 本地开发临时启用：让宿主机 Java 进程（mvn spring-boot:run）能直接连 localhost:3306
    ports:
      - "127.0.0.1:3306:3306"

  # ---------------------------------------------------------------------------
  # Spring Boot backend
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ideaparty/server:latest
    container_name: idea-server
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - idea-net
    env_file:
      - .env.production
    environment:
      # Spring Boot relaxed binding: SPRING_DATASOURCE_* overrides application.properties
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ideaparty}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # JWT (override empty defaults in application.yml)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}

      # DeepSeek
      LANGCHAIN4J_OPEN_AI_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      LANGCHAIN4J_OPEN_AI_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LANGCHAIN4J_OPEN_AI_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

      # CORS — comma-separated list of allowed origins.
      # PUBLIC_BASE_URL 是浏览器访问的入口（必填在 .env.production 里），本地 Vite 默认端口同时保留以便 dev。
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required},http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177

      # Default admin (DataLoader seed on first boot)
      # 与 .env.production 中的 APP_ADMIN_USERNAME/APP_ADMIN_PASSWORD 同源
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin123}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}

      # Server-side
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
      JAVA_OPTS: ${SERVER_JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    volumes:
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    # Exposed only inside the docker network via the client proxy.
    # If you need direct access (e.g. for mobile dev), uncomment:
    # ports:
    #   - "127.0.0.1:8080:8080"

  # ---------------------------------------------------------------------------
  # Vue 3 frontend (Nginx serving SPA + reverse proxy to server)
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # When the client talks to /api (relative), it doesn't strictly need a base URL.
        # Set VITE_WS_URL only if you have a separate WS host. Empty = use same origin via nginx.
        VITE_SERVER_PROXY_PORT: "8080"
        VITE_WS_URL: ""
    image: ideaparty/client:latest
    container_name: idea-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - idea-net
    ports:
      # Nginx listens on 80 inside the container. Map to a public port.
      # IMPORTANT: on Tencent Cloud, open this port in the security group.
      - "${CLIENT_PORT:-80}:80"
    volumes:
      # Persist the nginx proxy cache across container restarts / image rebuilds.
      # Without this, every `docker compose up` wipes /var/cache/nginx/api and
      # the first 1000 requests after each deploy take the cache-miss penalty.
      - nginx-cache:/var/cache/nginx
      # OSS 迁移后:不再挂 server-uploads 卷(图片走阿里云 OSS 桶,
      # nginx 看到 /uploads/ 和 /api/upload/avatars/ 直接 301 到 OSS 默认域名)。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  idea-net:
    driver: bridge
    name: idea-net

volumes:
  mysql-data:
    name: idea-mysql-data
  server-uploads:
    name: idea-server-uploads
  server-logs:
    name: idea-server-logs
  nginx-cache:
    name: idea-nginx-cache
