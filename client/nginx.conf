# =============================================================================
# Nginx config for Idea-Party client
# - Serves SPA from /usr/share/nginx/html (history mode routing)
# - Proxies /api and /uploads to backend service
# - Proxies /ws WebSocket to backend service
# Designed to work with docker-compose service name "server" on port 8080
# =============================================================================

# WebSocket connection upgrade map (needed for proxy_pass)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream backend - resolved by Docker DNS
upstream ideaparty_backend {
    server server:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Sensible client body size (matches Spring's 25MB limit)
    client_max_body_size 25m;

    # Security & performance headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression for text payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- API proxy (REST) ----
    # 加 ^~ 强制 prefix location 优先于下方"匹配 .jpg/.png" 的正则 location，
    # 否则 /api/upload/avatars/presets/foo.jpg 会被当作静态资源 404（路径里以 .jpg 结尾）
    location ^~ /api/ {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Buffering off helps streaming responses feel snappier
        proxy_buffering off;
    }

    # ---- Uploads (avatars, character images) ----
    # 同理加 ^~ 防止被下方静态资源 location 截胡（用户上传的头像 URL 也可能以 .jpg/.png 结尾）
    location ^~ /uploads/ {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache uploaded media for 7 days
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- WebSocket (real-time chat) ----
    location /ws {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived
        proxy_connect_timeout 7s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering off;
    }

    # ---- Static assets (cache aggressively, fingerprinted by Vite) ----
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- SPA fallback (history mode: all unknown paths → index.html) ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Health endpoint (for compose / k8s probes) ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
