# =============================================================================
# Nginx config for Idea-Party client
# - Serves SPA from /usr/share/nginx/html (history mode routing)
# - Proxies /api and /uploads to backend service
# - Proxies /ws WebSocket to backend service
# - Caches /api/characters/presets & /recommended (read-heavy, static) for 5min
# - Caches /api/upload/avatars/{scenarios,presets,hot-rooms}/*.jpg for 30d
#   (avatar/cover images are read-only static resources;运维换图后用
#    `docker exec idea-client rm -rf /var/cache/nginx/api/*` 强刷)
# Designed to work with docker-compose service name "server" on port 8080
# =============================================================================

# WebSocket connection upgrade map (needed for proxy_pass)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache key for the preset endpoints:
#   - vary by URI + query string (category=SCIENTIST vs STAR returns different lists)
#   - ignore headers like User-Agent / Accept-Language / Cookie to maximize hit rate
#   - DON'T vary by Authorization — these endpoints return the same list to all
#     logged-in users. Including Authorization would split the cache per-user and
#     effectively disable it. (The current endpoints are public to authenticated
#     users; if a future preset endpoint becomes per-user, scope it out.)
proxy_cache_key "$scheme$request_method$host$request_uri";

# Disk-backed proxy cache.
#   - keys_zone: 10MB shared memory ≈ 80k keys (we only have ~6 keys: presets,
#     recommended, +4 categories). Sized conservatively.
#   - max_size: 100MB hard cap on disk usage. 120 chars × ~1KB gzip'd JSON is
#     well under 1MB per response; 100MB holds thousands of variants.
#   - inactive: evict entries not accessed for 30min (vs the 5min valid window
#     — long enough for any sensible repeat-visit pattern).
#   - use_temp_path=off: write directly to the cache dir, avoid the extra copy
#     from <cache>/tmp to <cache>.
# Mounted from the host via a named volume in docker-compose so the cache
# survives container restarts and image rebuilds.
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=30m
    use_temp_path=off;

# Upstream backend - resolved by Docker DNS
upstream ideaparty_backend {
    server server:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Sensible client body size (matches Spring's 25MB limit)
    client_max_body_size 25m;

    # Security & performance headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression for text payloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---- Cached preset endpoints ----
    # Read-heavy, public, ~5min staleness is acceptable. Nginx serves the
    # response directly from disk on HIT, never touching the Spring Boot JVM.
    #
    # Why exact match (=) instead of prefix: we want to cache ONLY these two
    # endpoints. A prefix /api/characters/presets would also match
    # /api/characters/presets/something-else (none today, but defensive).
    #
    # Why GET only: cache POST/PUT/DELETE on these paths is meaningless
    # (server returns 405 anyway) but blocking them explicitly is clearer.
    #
    # proxy_cache_valid 200 5m: only cache 2xx, for 5 minutes. 4xx/5xx errors
    # are NEVER cached → a backend hiccup doesn't poison the cache for 5min.
    #
    # X-Cache-Status header: HIT / MISS / BYPASS / EXPIRED / STALE / UPDATING.
    # Useful for verifying the cache is doing its job (curl -I twice).
    location = /api/characters/presets {
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_methods GET;
        # Don't insert a stale-while-revalidate window here — preset data
        # is low-stakes and a fresh fetch is cheap. KISS.
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /api/characters/recommended {
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ---- Cached avatar/cover image endpoints ----
    # 头像/封面图(/api/upload/avatars/{scenarios,presets,hot-rooms}/)都是只读静态资源,
    # 命中后由 Nginx 直接走磁盘返回,完全不再打 Spring Boot。
    #
    # 必须放在 location ^~ /api/ 之前 + 加 ^~ 前缀:否则被 /api/ 截胡(普通反代,不缓存)。
    #
    # 缓存策略分两层:
    #   - Nginx 磁盘(proxy_cache_valid 200 30d):后端不参与,运维换图后需手动失效(见下)
    #   - 浏览器(expires 1d + must-revalidate):比 30d 短,运营改图后用户最多 1 天看到新版
    #
    # 运营换图后让缓存立即生效:
    #   docker exec idea-client rm -rf /var/cache/nginx/api/*
    #   docker exec idea-client nginx -s reload
    # 浏览器侧还要硬刷(⌘+Shift+R)跳过 1d 浏览器缓存,或带 ?v=<hash> 强制 MISS。
    #
    # 30d / 1d 缓存时间的选择:
    #   - scenarios 是本次新增的 22 张 Picsum 图,文件名固定,3 年内不会换 → 30d
    #   - presets 是运营可换的预设头像,偶尔有调整 → 30d 也够(后端 WebConfig 已设 1h 浏览器缓存)
    #   - hot-rooms 是热门聊天室封面,极少改动 → 30d
    location ^~ /api/upload/avatars/scenarios/ {
        proxy_cache api_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_methods GET;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ^~ /api/upload/avatars/presets/ {
        proxy_cache api_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_methods GET;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ^~ /api/upload/avatars/hot-rooms/ {
        proxy_cache api_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_methods GET;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # ---- API proxy (REST) ----
    # 加 ^~ 强制 prefix location 优先于下方"匹配 .jpg/.png" 的正则 location，
    # 否则 /api/upload/avatars/presets/foo.jpg 会被当作静态资源 404（路径里以 .jpg 结尾）
    location ^~ /api/ {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Buffering off helps streaming responses feel snappier
        proxy_buffering off;
    }

    # ---- Uploads (avatars, character images) ----
    # 同理加 ^~ 防止被下方静态资源 location 截胡（用户上传的头像 URL 也可能以 .jpg/.png 结尾）
    location ^~ /uploads/ {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 启用 nginx 反代磁盘缓存：preset 头像/封面是只读静态资源,适合长缓存;
        # 走 api_cache 共享缓存区(已配 100MB,够装下 30MB presets + 6MB hot-rooms)。
        # 与下方 presets/recommended 的差别:这里不在 preset_cache_valid 上,是因为
        # 用户上传头像的 URL 也走这里,后端 304/200 都可能,统一 7d 即可。
        proxy_cache api_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_methods GET;
        add_header X-Cache-Status $upstream_cache_status always;

        # 浏览器端缓存 1 天 + must-revalidate:preset/封面多数是只读,
        # 1 天比 7 天安全,避免"修改头像后用户看不到"的问题。
        # 不加 immutable:URL 是稳定字符串(不是 fingerprinted),内容可能更新。
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # ---- WebSocket (real-time chat) ----
    location /ws {
        proxy_pass http://ideaparty_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections are long-lived
        proxy_connect_timeout 7s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering off;
    }

    # ---- Static assets (cache aggressively, fingerprinted by Vite) ----
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- SPA fallback (history mode: all unknown paths → index.html) ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Health endpoint (for compose / k8s probes) ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
