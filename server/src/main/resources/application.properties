# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.application.name=ideaparty-server

# MySQL Configuration — 全部从环境变量读取，避免凭据进入仓库
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ideaparty?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration — secret 必须通过环境变量 JWT_SECRET 注入，启动期校验最小长度（≥32 字节 / 256 位）
# 不要把真实密钥提交到仓库；生产环境建议从密钥管理服务（如 Vault / AWS KMS / 容器 secret）注入
jwt.secret=${JWT_SECRET:CHANGE_ME_INSECURE_DEV_ONLY_KEY_MUST_BE_AT_LEAST_32_BYTES}
jwt.secret.min-length=32
# 48 hours = 48 * 60 * 60 * 1000 = 172800000 ms
jwt.expiration=${JWT_EXPIRATION:172800000}

# LangChain4j / DeepSeek Configuration
langchain4j.open-ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
langchain4j.open-ai.api-key=${DEEPSEEK_API_KEY:sk-dummy-key-for-testing}
langchain4j.open-ai.model=${DEEPSEEK_MODEL:deepseek-chat}
langchain4j.open-ai.streaming=true
langchain4j.open-ai.timeout=120s

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.ideaparty=DEBUG

# Upload limits — 抽到配置便于多环境调整
upload.avatar.max-size=${UPLOAD_AVATAR_MAX_SIZE:5242880}
upload.file.max-size=${UPLOAD_FILE_MAX_SIZE:5242880}
