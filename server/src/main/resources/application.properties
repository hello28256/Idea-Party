# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.application.name=ideaparty-server

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ideaparty?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=ideaparty-super-secret-key-that-is-at-least-256-bits-long-for-hs256
# 48 hours = 48 * 60 * 60 * 1000 = 172800000 ms
jwt.expiration=172800000

# LangChain4j / DeepSeek Configuration
langchain4j.open-ai.base-url=https://api.deepseek.com
langchain4j.open-ai.api-key=${DEEPSEEK_API_KEY:sk-dummy-key-for-testing}
langchain4j.open-ai.model=deepseek-chat
langchain4j.open-ai.streaming=true
langchain4j.open-ai.timeout=120s

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.ideaparty=DEBUG
