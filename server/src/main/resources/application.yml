server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ideaparty?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: 3d8a9f7e2c4b1a5f6e8d9c3b2a7f1e4d9c8b2a6f3e1d7c5b9a8f2e4d6c1a3b5
  expiration: 900000

logging:
  level:
    com.ideaparty: INFO
    org.springframework.security: INFO
