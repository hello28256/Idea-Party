# =============================================================================
# Idea-Party Server 全局配置
# 之前散落在 application.yml + application.properties 两份，现已合并为单一来源。
# 优先级：application.yml < 环境变量 < 命令行 > profile-specific 文件
# 占位符语法：${KEY:default}，默认值与冒号之间不要加空格，否则 yml 解析会失败。
# =============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ideaparty-server
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    # useUnicode + characterEncoding=UTF-8 强制客户端用 UTF-8 与服务端通信，
    # 避免 latin1↔utf8 来回切换导致"双重编码"乱码（如英文/西文角色名变 å…‹<å°©@å¥¶）。
    # connectionCollation 锁住连接级排序规则，与服务端 default collation 保持一致。
    # 注意：MySQL 服务端 character_set_server 必须是 utf8mb4，characters 表/列也需 utf8mb4 才能彻底生效。
    url: ${DB_URL:jdbc:mysql://localhost:3306/ideaparty?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

# =============================================================================
# JWT 配置
# secret 必须通过环境变量 JWT_SECRET 注入，启动期校验最小长度（≥32 字节 / 256 位）。
# 不要把真实密钥提交到仓库；生产环境建议从密钥管理服务（Vault / KMS / 容器 secret）注入。
# =============================================================================
jwt:
  # 开发期 fallback：与 AuthService.validateJwtSecret 配套，避免「未设置环境变量」时启动失败
  secret: ${JWT_SECRET:CHANGE_ME_INSECURE_DEV_ONLY_KEY_MUST_BE_AT_LEAST_32_BYTES}
  # 启动期校验最小长度（≥32 字节 / 256 位）—— 与 AuthService.@Value("${jwt.secret.min-length}") 配套
  # yml 不支持带点号的 key，需用方括号形式 [key.subkey]: value
  "[secret.min-length]": 32
  expiration: ${JWT_EXPIRATION:172800000}

# =============================================================================
# LangChain4j / DeepSeek 配置
# AI 调用底层参数：api-key 缺失会触发 AIService 的 dummy 模式（启动不报错）
# =============================================================================
langchain4j:
  open-ai:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:sk-dummy-key-for-testing}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    streaming: true
    timeout: 120s

# =============================================================================
# 文件上传大小上限（10MB 文件 / 头像通用）
# =============================================================================
upload:
  avatar:
    max-size: ${UPLOAD_AVATAR_MAX_SIZE:5242880}

# =============================================================================
# 腾讯云 COS + CAM 配置 (主存储)
# 全部从环境变量读,代码里不允许出现 Secret 字面量。
# 生产部署: 在 .env.production 设置 TENCENT_COS_*。
# 桶名: idea-party-uploads-1361890600 (首尔 ap-seoul,跟 ECS 同地域,零跨境)
# PR3 完成迁移: 删除了 aliyun 块, 后端 StsTokenService 走 CAM AssumeRole。
# =============================================================================
tencent:
  cos:
    bucket: ${TENCENT_COS_BUCKET:idea-party-uploads-1361890600}
    region: ${TENCENT_COS_REGION:ap-seoul}
    endpoint: ${TENCENT_COS_ENDPOINT:https://idea-party-uploads-1361890600.cos.ap-seoul.myqcloud.com}
    bucket-domain: ${TENCENT_COS_BUCKET_DOMAIN:https://idea-party-uploads-1361890600.cos.ap-seoul.myqcloud.com}
    key-prefix: ${TENCENT_COS_KEY_PREFIX:uploads/}
  cam:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    role-arn: ${TENCENT_COS_ROLE_ARN:}
    role-session-name: ${TENCENT_COS_ROLE_SESSION_NAME:ideaparty-cos-upload}
    duration-seconds: ${TENCENT_COS_DURATION_SECONDS:3600}
  file:
    max-size: ${UPLOAD_FILE_MAX_SIZE:5242880}

# =============================================================================
# 日志
# =============================================================================
logging:
  level:
    com.ideaparty: DEBUG
    org.springframework: INFO
    org.springframework.security: INFO

# =============================================================================
# 应用级配置
# =============================================================================
app:
  admin:
    # Comma-separated list of user UUIDs (no quotes) granted admin access as a fallback
    # when the user's `is_admin` column is false. Useful to bootstrap the first admin
    # without having to UPDATE users manually.
    # Get your UUID by hitting GET /api/user/profile after logging in.
    user-ids: ${APP_ADMIN_USER_IDS:}
    # 默认管理员用户名；DataLoader 在全新库按此名幂等创建管理员账号
    # 默认值 admin123 与产品文档"开箱即用管理员"约定保持一致
    default-username: ${APP_ADMIN_USERNAME:admin123}
    # 默认管理员密码（明文仅在首次创建时使用一次，立即 BCrypt 哈希后落库）
    # 生产环境务必通过环境变量覆盖，避免使用默认值 admin123
    default-password: ${APP_ADMIN_PASSWORD:admin123}

# =============================================================================
# ENCRYPTION_KEY: Base64-encoded 32-byte key for AES-256-GCM encryption
# Generate with: openssl rand -base64 32
# When not set, API keys are stored as plain text (backward compatibility mode)
# =============================================================================
# 实际使用 EncryptionUtil 读取环境变量；此处无配置项，仅保留注释
