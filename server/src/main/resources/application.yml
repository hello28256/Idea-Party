# =============================================================================
# Encryption Configuration (ENHANCE-01)
# =============================================================================
# ENCRYPTION_KEY: Base64-encoded 32-byte key for AES-256-GCM encryption
# Generate with: openssl rand -base64 32
# When not set, API keys are stored as plain text (backward compatibility mode)
# =============================================================================

server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://localhost:3306/ideaparty?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  # JWT secret key (Base64-encoded, minimum 256 bits recommended)
  secret: ${JWT_SECRET:}
  expiration: 900000

logging:
  level:
    com.ideaparty: INFO
    org.springframework.security: INFO
