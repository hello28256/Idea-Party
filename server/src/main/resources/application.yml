server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ideaparty?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: 900000

logging:
  level:
    com.ideaparty: INFO
    org.springframework.security: INFO
