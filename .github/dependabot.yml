version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependency'
      - 'frontend'
    # vite 锁版本,esbuild 不要单独升;lucide-vue-next 也不让 it 自动跳
    ignore:
      - dependency-name: 'esbuild'
      - dependency-name: 'lucide-vue-next'

  - package-ecosystem: 'maven'
    directory: '/server'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependency'
      - 'backend'
    # Spring Boot 锁版本时升很危险,人工统一升级
    ignore:
      - dependency-name: 'spring-boot-starter-parent'
      - dependency-name: 'spring-boot-starter-*'
