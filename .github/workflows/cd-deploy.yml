name: CD · Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/tag/SHA). 留空用 main HEAD。'
        required: false
        default: ''
        type: string

concurrency:
  # CD 不能被并行取消 —— 取消一半会留下半部署的容器
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Validate required secrets present
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::Missing DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets"
            exit 1
          fi

      - name: "Pre-flight: confirm server has .env.production"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/ideaparty
            test -f .env.production || {
              echo "::error::服务器上缺少 /opt/ideaparty/.env.production"
              echo "::error::首次部署请手工 scp 一次(deploy.py --sync-env 也可)"
              exit 1
            }
            # 轻量校验:必须有 DeepSeek key + OSS 必备项(项目必需)
            # 架构: 前端拿 STS 临时凭证浏览器直传 OSS,所以 server 端需要的是 STS 那组
            # (RAM 用户 AK, 用于 AssumeRole 签发凭证),不是长期 OSS AccessKey
            grep -q "^DEEPSEEK_API_KEY=.\+" .env.production || { echo "::error::缺少 DEEPSEEK_API_KEY"; exit 1; }
            grep -q "^ALIYUN_OSS_BUCKET=.\+" .env.production || { echo "::error::缺少 ALIYUN_OSS_BUCKET"; exit 1; }
            grep -q "^ALIYUN_OSS_ENDPOINT=.\+" .env.production || { echo "::error::缺少 ALIYUN_OSS_ENDPOINT"; exit 1; }
            grep -q "^ALIYUN_STS_ACCESS_KEY_ID=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ACCESS_KEY_ID"; exit 1; }
            grep -q "^ALIYUN_STS_ACCESS_KEY_SECRET=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ACCESS_KEY_SECRET"; exit 1; }
            grep -q "^ALIYUN_STS_ROLE_ARN=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ROLE_ARN"; exit 1; }
            echo "✅ env file OK"

      - name: Decide ref to deploy
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF=main
          fi
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Deploy via deploy.py
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # --skip-uploads:
          #   deploy.py 默认会同步 uploads/avatars/* 到卷 + 增量上 OSS。
          #   这俩是大文件/OSS 调用,CD 不必每次都跑;
          #   uploads 同步留作运维手动 ./scripts/oss-sync-avatars.sh。
          script: |
            set -e
            # /opt/ideaparty 第一次铺的时候可能是 scp 上去的,不是 git clone。
            # workflow 自身不假设它是 git repo(见 deploy.py 的设计,它用 rsync 同步),
            # 但保留 .git 能让运维 'cd /opt/ideaparty && git log -1' 排查时方便。
            # 因此:无 .git 就 clone 一次,有就 fast-forward 更新,两者都失败不阻断 deploy
            # (deploy.py 会自己把代码 rsync 过来)。
            cd /opt/ideaparty
            if [ ! -d .git ]; then
              echo "::warning::首次部署:/opt/ideaparty 缺 .git,补一个浅 clone(不影响 deploy.py 同步)"
              ( cd /opt/ideaparty/.. && \
                [ -f /opt/ideaparty/.env.production ] && cp /opt/ideaparty/.env.production /root/env.production.bak; \
                [ -f /opt/ideaparty/docker-compose.yml ] && cp /opt/ideaparty/docker-compose.yml /root/docker-compose.yml.bak; \
                rm -rf /opt/ideaparty && \
                git clone --depth 50 https://github.com/hello28256/Idea-Party.git /opt/ideaparty && \
                [ -f /root/env.production.bak ] && cp /root/env.production.bak /opt/ideaparty/.env.production; \
                [ -f /root/docker-compose.yml.bak ] && cp /root/docker-compose.yml.bak /opt/ideaparty/docker-compose.yml \
              ) || echo "::warning::git clone 自愈失败,继续 deploy(由 deploy.py rsync 提供代码)"
            else
              git fetch origin main 2>/dev/null || echo "::warning::git fetch 失败,继续"
              git reset --hard origin/main 2>/dev/null || echo "::warning::git reset 失败,继续"
            fi
            REF="${{ steps.ref.outputs.value }}"
            if [ "$REF" != "main" ] && [ -d .git ]; then
              git fetch origin "$REF" 2>/dev/null || true
              git checkout --force "$REF" 2>/dev/null || echo "::warning::git checkout $REF 失败,继续"
            fi
            [ -d .git ] && git log -1 --oneline 2>/dev/null || echo "::notice::无 .git,跳过 git log"
            python3 deploy.py --skip-uploads

      - name: Smoke check
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/ideaparty
            # deploy.py:582 _wait_for_healthy 已经等过;这里再过一次双重确认
            python3 deploy.py --status 2>&1 | tail -n 20
