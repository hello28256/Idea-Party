name: CD · Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/tag/SHA). 留空用 main HEAD。'
        required: false
        default: ''
        type: string

concurrency:
  # CD 不能被并行取消 —— 取消一半会留下半部署的容器
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Validate required secrets present
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::Missing DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets"
            exit 1
          fi

      - name: "Pre-flight: confirm server has .env.production"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            # v2: 不假设 /opt/ideaparty 是 active 目录。Pre-flight 优先看 active,
            # 找不到再找最新的 stale.* 目录(上次自愈 mv 走的),这是给运维手感用的
            # —— 真正的恢复由 Deploy step 完成。Pre-flight 只做"env 文件里有什么"
            # 的轻量校验,目录在不在由 Deploy step 兜底。
            cd /opt/ideaparty 2>/dev/null || cd /opt/ideaparty.stale.*/ 2>/dev/null || {
              echo "::error::服务器上 /opt/ideaparty 不存在,也没找到 stale 备份"
              echo "::error::首次部署请手工: mkdir -p /opt/ideaparty && cd /opt && git clone https://github.com/hello28256/Idea-Party.git ideaparty"
              echo "::error::然后再 scp .env.production + docker-compose.yml 进去"
              exit 1
            }
            pwd
            test -f .env.production || {
              echo "::error::当前目录缺少 .env.production"
              echo "::error::请手工 scp .env.production 到 /opt/ideaparty/.env.production"
              exit 1
            }
            # 轻量校验:必须有 DeepSeek key + OSS 必备项(项目必需)
            # 架构: 前端拿 STS 临时凭证浏览器直传 OSS,所以 server 端需要的是 STS 那组
            # (RAM 用户 AK, 用于 AssumeRole 签发凭证),不是长期 OSS AccessKey
            grep -q "^DEEPSEEK_API_KEY=.\+" .env.production || { echo "::error::缺少 DEEPSEEK_API_KEY"; exit 1; }
            grep -q "^ALIYUN_OSS_BUCKET=.\+" .env.production || { echo "::error::缺少 ALIYUN_OSS_BUCKET"; exit 1; }
            grep -q "^ALIYUN_OSS_ENDPOINT=.\+" .env.production || { echo "::error::缺少 ALIYUN_OSS_ENDPOINT"; exit 1; }
            grep -q "^ALIYUN_STS_ACCESS_KEY_ID=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ACCESS_KEY_ID"; exit 1; }
            grep -q "^ALIYUN_STS_ACCESS_KEY_SECRET=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ACCESS_KEY_SECRET"; exit 1; }
            grep -q "^ALIYUN_STS_ROLE_ARN=.\+" .env.production || { echo "::error::缺少 ALIYUN_STS_ROLE_ARN"; exit 1; }
            echo "✅ env file OK"

      - name: Decide ref to deploy
        id: ref
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF=main
          fi
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      - name: Deploy via deploy.py
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # --skip-uploads:
          #   deploy.py 默认会同步 uploads/avatars/* 到卷 + 增量上 OSS。
          #   这俩是大文件/OSS 调用,CD 不必每次都跑;
          #   uploads 同步留作运维手动 ./scripts/oss-sync-avatars.sh。
          script: |
            set -e
            BACKUP_DIR=/tmp/ideaparty-backup-$$
            mkdir -p "$BACKUP_DIR"
            TS=$(date +%Y%m%d-%H%M%S)

            # -------- Step A: 如果 /opt/ideaparty 整个不存在,先 mkdir 占位 --------
            if [ ! -d /opt/ideaparty ]; then
              echo "::warning::/opt/ideaparty 不存在,准备自愈(mkdir 占位 + 后续 git clone)"
              sudo mkdir -p /opt/ideaparty || {
                echo "::error::无法创建 /opt/ideaparty(deploy 用户需 sudo)"
                exit 1
              }
              sudo chown "$(id -u)":"$(id -g)" /opt/ideaparty
              # 注意:此时 /opt/ideaparty 是空目录,deploy.py 会找不到 deploy.py 而失败,
              # 由 Step B 自愈后才有代码
            fi
            cd /opt/ideaparty

            # -------- Step B: 自愈 .git / 代码 --------
            # v2 设计原则:
            #   - 不 rm-rf,用 mv 走 stale 路径(原子操作,失败概率极低)
            #   - 备份到 /tmp/ideaparty-backup/$$  (deploy 用户可写)
            #   - 备份、clone、恢复三步完全独立,各自 || true 打 warning
            #   - 任一步失败不阻断 deploy.py 主体,但 deploy.py 启动前有 test -f 守门
            if [ ! -d .git ]; then
              echo "::warning::首次部署:/opt/ideaparty 缺 .git,补一个浅 clone"
              # 备份现有运维文件(独立 try,失败只打 warning 不退出)
              if [ -f .env.production ]; then
                cp .env.production "$BACKUP_DIR/env.production" \
                  || echo "::warning::备份 .env.production 失败"
              fi
              if [ -f docker-compose.yml ]; then
                cp docker-compose.yml "$BACKUP_DIR/docker-compose.yml" \
                  || echo "::warning::备份 docker-compose.yml 失败"
              fi
              # 把现有非 .git 内容(可能含运维文件)mv 到 stale 路径而非 rm-rf
              if [ -n "$(ls -A . 2>/dev/null)" ]; then
                STALE=/opt/ideaparty.stale.$TS
                mv /opt/ideaparty "$STALE" 2>/dev/null \
                  || echo "::warning::mv 到 $STALE 失败,继续"
                sudo mkdir -p /opt/ideaparty 2>/dev/null || mkdir -p /opt/ideaparty
                sudo chown "$(id -u)":"$(id -g)" /opt/ideaparty 2>/dev/null || true
              fi
              # clone(独立 try,失败打 warning 但不阻断)
              git clone --depth 50 https://github.com/hello28256/Idea-Party.git /opt/ideaparty \
                || echo "::warning::git clone 失败,deploy.py 启动前会 fail-fast"
              # 恢复备份(独立 try)
              [ -f "$BACKUP_DIR/env.production" ] && \
                cp "$BACKUP_DIR/env.production" /opt/ideaparty/.env.production \
                || echo "::notice::无 env.production 备份可恢复"
              [ -f "$BACKUP_DIR/docker-compose.yml" ] && \
                cp "$BACKUP_DIR/docker-compose.yml" /opt/ideaparty/docker-compose.yml \
                || echo "::notice::无 docker-compose.yml 备份可恢复"
            else
              # 已 .git: fast-forward 即可,不破坏工作树(deploy.py 会 rsync 覆盖)
              git fetch origin main 2>/dev/null || echo "::warning::git fetch 失败,继续"
              git reset --hard origin/main 2>/dev/null || echo "::warning::git reset 失败,继续"
            fi

            # -------- Step C: 非 main ref 切换(独立 try) --------
            REF="${{ steps.ref.outputs.value }}"
            if [ "$REF" != "main" ] && [ -d /opt/ideaparty/.git ]; then
              (cd /opt/ideaparty && git fetch origin "$REF" 2>/dev/null && \
                git checkout --force "$REF" 2>/dev/null) \
                || echo "::warning::checkout $REF 失败,继续"
            fi

            # -------- Step D: 守门:deploy.py 必须存在才能跑 --------
            cd /opt/ideaparty
            if [ ! -f deploy.py ]; then
              echo "::error::自愈后 /opt/ideaparty 仍缺 deploy.py"
              echo "::error::可能 git clone 网络失败。请手工:"
              echo "::error::   sudo rm -rf /opt/ideaparty && sudo mkdir -p /opt/ideaparty && \\"
              echo "::error::   sudo chown \$USER:\$USER /opt/ideaparty && \\"
              echo "::error::   cd /opt && git clone https://github.com/hello28256/Idea-Party.git ideaparty && \\"
              echo "::error::   cd ideaparty && scp <本机>:.env.production . && scp <本机>:docker-compose.yml ."
              exit 1
            fi

            # -------- Step E: 跑 deploy --------
            [ -d .git ] && git log -1 --oneline 2>/dev/null || echo "::notice::无 .git,跳过 git log"
            python3 deploy.py --skip-uploads

            # 清理临时备份
            rm -rf "$BACKUP_DIR" 2>/dev/null || true

      - name: Smoke check
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /opt/ideaparty
            # deploy.py:582 _wait_for_healthy 已经等过;这里再过一次双重确认
            python3 deploy.py --status 2>&1 | tail -n 20
