name: CD · Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/tag/SHA). 留空用 main HEAD。'
        required: false
        default: ''
        type: string

concurrency:
  # CD 不能被并行取消 —— 取消一半会留下半部署的容器
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Validate required secrets present
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::Missing DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY secrets"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 的 ref 输入优先, 留空用 main HEAD
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Materialize deploy SSH key
        # deploy.py 通过 DEPLOY_SSH_KEY 读取"本机 SSH 私钥路径",
        # 所以要把 secret 落到 runner 的临时文件再传路径进去。
        # runner 用完即删, 不进 artifact。
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 防止 deploy.py 弹 known_hosts 交互
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "Pre-flight: confirm server has .env.production"
        # 注意: 这一步是 SSH 到 VPS, 因为 .env.production 在 VPS 上;
        # deploy.py 自己用 rsync 推代码, 但 .env.production 在 .gitignore 里
        # 不会被 rsync 推, 必须 VPS 上手工放好。
        # Pre-flight 验真 + 提示手工恢复指引(不修, 只检查)。
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/ideaparty 2>/dev/null || {
              echo "::error::VPS 上 /opt/ideaparty 不存在,无法 Pre-flight"
              echo "::error::请先在 VPS 上手工建空目录(deploy.py 会负责把代码 rsync 进去):"
              echo "::error::   sudo mkdir -p /opt/ideaparty && sudo chown \$USER:\$USER /opt/ideaparty"
              exit 1
            }
            pwd
            test -f .env.production || {
              echo "::error::VPS 上 .env.production 缺失, deploy.py rsync 不会带这个文件"
              echo "::error::请手工 scp .env.production 到 /opt/ideaparty/.env.production:"
              echo "::error::   scp -i ~/.ssh/<key> .env.production ubuntu@<vps>:/tmp/ && \\"
              echo "::error::   ssh ubuntu@<vps> 'sudo cp /tmp/.env.production /opt/ideaparty/.env.production && sudo chown \$USER:\$USER /opt/ideaparty/.env.production && chmod 600 /opt/ideaparty/.env.production'"
              exit 1
            }
            # 轻量校验: 关键 env 必须存在
            for key in DEEPSEEK_API_KEY ALIYUN_OSS_BUCKET ALIYUN_OSS_ENDPOINT \
                       ALIYUN_STS_ACCESS_KEY_ID ALIYUN_STS_ACCESS_KEY_SECRET \
                       ALIYUN_STS_ROLE_ARN; do
              grep -q "^${key}=.\\+" .env.production || {
                echo "::error::缺少 ${key}"; exit 1;
              }
            done
            echo "✅ env file OK"

      - name: Deploy via deploy.py
        # 关键设计变更(v3):
        # deploy.py 的 action_sync() 是用本地 Path.cwd() 当 source,
        # 然后 rsync 到 VPS。它设计上是从"本机"跑的工具,
        # 不是从 VPS 跑的。所以 CD 必须在 GitHub Actions runner 上跑,
        # 不在 VPS 上跑。
        #
        # VPS 在这步完全是被动接收: 只走 deploy.py 的 ssh_cmd()
        # 调 docker compose / docker pull / docker exec 等。
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ~/.ssh/deploy_key
          DEPLOY_REMOTE_DIR: /opt/ideaparty
          DEPLOY_REMOTE_ENV_FILE: .env.production
          DEPLOY_UPLOADS_VOLUME: idea-server-uploads
          DEPLOY_UPLOADS_IMAGE: alpine:3.19
          DEPLOY_UPLOADS_MIN_PRESETS: "100"
        run: |
          set -euo pipefail
          # 不加 --skip-uploads: 前端硬编码走 OSS 桶 (https://idea-party-uploads.oss-cn-shenzhen...),
          # CD 必须跑 upload_uploads.py 把新加的图片推到 OSS,否则前端 404。
          # upload_uploads.py 走 manifest 增量,日常 deploy 0~几十次 PUT,几秒过。
          # --use-tar: 跨境 (GitHub runner 海外 -> 腾讯云上海 VPS) 走 tar 流,
          # 1000+ 小文件比 rsync 快 5-10x (10-30 KB/s -> 1-3 MB/s)。
          python3 deploy.py --use-tar

      - name: Smoke check
        if: success()
        # 复用 deploy.py --status 远程拉容器状态, 跟 Pre-flight 一样只是 ssh,
        # VPS 上没有 git / clone, 没有任何 CD workflow 自身的代码, 只有
        # deploy.py 推过来的项目源码 + .env.production。
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/ideaparty
            # deploy.py 内部 _wait_for_healthy 已经等过, 这里再过一次双重确认
            python3 deploy.py --status 2>&1 | tail -n 20

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "::notice::deploy key 已清理"
