name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint+test+build)
    runs-on: ubuntu-latest
    defaults:
      working-directory: client
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        # --legacy-peer-deps 匹配 client/Dockerfile:16,避免 lucide-vue-next 等新依赖触发 ERESOLVE

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 3
          if-no-files-found: ignore

  server:
    name: Server (compile+test)
    runs-on: ubuntu-latest
    defaults:
      working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # CI 必须跑测试(server/Dockerfile:23 跳测试是 build 时优化,不能影响 CI)
      - name: Run tests
        run: mvn -B test
        env:
          # 占位环境变量,避免 application.yml 里的 ${...} 在测试期找不到
          SPRING_PROFILES_ACTIVE: test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/*.jar
          retention-days: 3
          if-no-files-found: ignore

  docker-buildx-validate:
    name: Docker buildx validate
    runs-on: ubuntu-latest
    # 不 push,只验证 client/ 和 server/ 的 Dockerfile 能 build 通
    needs: [client, server]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate server Dockerfile
        run: |
          docker buildx build \
            --load \
            --tag idea/ci-server:validate \
            --file server/Dockerfile \
            server

      - name: Validate client Dockerfile
        run: |
          docker buildx build \
            --load \
            --tag idea/ci-client:validate \
            --build-arg VITE_SERVER_PROXY_PORT=8080 \
            --build-arg VITE_WS_URL="" \
            --file client/Dockerfile \
            client

  status-check:
    name: ✅ All green
    runs-on: ubuntu-latest
    needs: [client, server, docker-buildx-validate]
    if: success()
    steps:
      - name: Success
        run: echo "CI passed — ready to merge / deploy"
