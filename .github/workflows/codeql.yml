name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 06:17 UTC(避开 0/30 分尖峰)
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  # The REST API must be enabled for Security tab
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: 🔒 CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 前端是 TS,javascript 实际扫到 TS;服务端是 Java
        language: ['javascript', 'java']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # CodeQL 需要历史调用图

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          paths-ignore:
            - client/dist
            - client/node_modules
            - '**/*.test.ts'
            - '**/*.test.java'
            - 'client/playwright-report'
            - 'client/test-results'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
